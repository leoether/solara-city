<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SOLARA CITY — Kota Terbuka</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1020;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    touch-action: none;
  }
  #fallback {
    position: fixed;
    left: 12px;
    bottom: 12px;
    color: #9fb0c8;
    font: 12px system-ui, sans-serif;
    display: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fallback">SOLARA CITY gagal dimuat — butuh browser dengan JavaScript dan Canvas 2D.</div>
<script type="module" src="./src/main.js"></script>
<script>
  window.addEventListener('error', function () {
    document.getElementById('fallback').style.display = 'block';
  });
</script>
</body>
</html>
