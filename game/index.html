<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SOLARA CITY — GTA-style Top-Down</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0e1a;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas {
    width: 100%; height: 100%; display: block;
    background: #1b2a4a; border-radius: 8px;
    box-shadow: 0 0 60px rgba(255, 170, 60, 0.25), 0 0 0 1px rgba(255,255,255,0.08);
    cursor: crosshair;
  }
  #hint {
    position: absolute; left: 10px; bottom: 8px;
    color: rgba(255,255,255,0.55); font-size: 12px;
    text-shadow: 0 1px 2px #000; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hint">SOLARA CITY v5 — WASD nyetir &middot; E curi mobil &middot; Klik tembak &middot; P pause &middot; M suara</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
